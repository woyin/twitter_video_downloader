services:
  app:
    # 镜像地址(全小写)。例如:ghcr.io/woyin/twitter_video_downloader:latest
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_NAME}:latest
    container_name: twitter_video_downloader
    restart: always
    # 仅在 Docker 内网暴露,Caddy 反代到公网
    expose:
      - "8000"
    networks:
      - caddy_net
    environment:
      - TZ=Asia/Shanghai
      - PORT=8000
      # 鉴权已启用:必须在宿主机 export API_KEY=<你的密钥> 后再启动,否则 compose 直接报错拒绝启动
      - API_KEY=${API_KEY:?请在宿主机执行 export API_KEY=你的密钥 后再启动}

# 复用已存在的 Caddy 网络
networks:
  caddy_net:
    external: true
